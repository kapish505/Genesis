name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,gateway]"
      - run: ruff check genesis runtime gateway tests
      - run: mypy --strict genesis runtime gateway
      - run: pytest -q
