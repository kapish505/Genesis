[project]
name = "genesis-agent"
version = "0.1.0"
description = "Genesis: intent-to-agent orchestration for ASI:One"
requires-python = ">=3.11,<3.15"
dependencies = [
  "uagents>=0.25.5,<0.27",
  "uagents-core>=0.4.9,<0.6",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "tenacity>=8.2,<10",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openai>=1.40,<2",
]

[project.optional-dependencies]
gateway = ["pypdf>=5,<6", "trafilatura>=1.12,<2", "tavily-python>=0.5,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "respx>=0.21,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["genesis", "runtime", "gateway"]

[[tool.mypy.overrides]]
module = "runtime.host_engine"
ignore_errors = true

[[tool.mypy.overrides]]
module = "genesis.agent"
disallow_untyped_decorators = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genesis", "runtime", "gateway"]
